<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Creations | Links and Shop</title>
  <meta name="description" content="3D Creations: find us on eBay, Instagram, TikTok and YouTube.">
  <style>
    :root { --bg:#1e1038; --card:#2c1850; --line:#4a2a7a; --ink:#fff4ee; --muted:#cdb8e6; --accent:#f0683a; --dark:#1e1038; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--bg); color: var(--ink); font-family: "Trebuchet MS","Segoe UI",system-ui,sans-serif; display: flex; justify-content: center; padding: 40px 20px 48px; }
    main { width: 100%; max-width: 460px; text-align: center; }
    .logo { width: 140px; height: 140px; border-radius: 24px; border: 2px solid var(--line); margin-bottom: 14px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .tag { color: var(--muted); margin: 0 0 24px; }

    .links { display: grid; gap: 12px; padding: 0; margin: 0 0 12px; list-style: none; }
    .links a { display: flex; align-items: center; gap: 14px; padding: 15px 18px; background: var(--card); border: 2px solid var(--line); border-radius: 14px; color: var(--ink); text-decoration: none; font-weight: 600; text-align: left; }
    .links a:hover { border-color: var(--accent); }
    .links a.main { background: var(--accent); border-color: var(--accent); color: var(--dark); font-weight: 700; }
    .links a.main svg { fill: var(--dark); }
    .links svg { width: 24px; height: 24px; flex: none; fill: var(--accent); }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    h2 { font-size: 1.05rem; color: var(--muted); font-weight: 600; margin: 34px 0 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: left; }
    .item { display: flex; flex-direction: column; background: var(--card); border: 2px solid var(--line); border-radius: 14px; overflow: hidden; color: var(--ink); text-decoration: none; }
    .item:hover { border-color: var(--accent); }
    .item img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; background: var(--line); }
    .item .info { padding: 10px 12px 12px; }
    .item .name { font-size: .9rem; line-height: 1.35; margin: 0 0 6px; }
    .item .price { color: var(--accent); font-weight: 800; }
    .more { display: block; margin-top: 14px; padding: 13px; border: 2px solid var(--line); border-radius: 14px; color: var(--ink); text-decoration: none; font-weight: 600; }
    .more:hover { border-color: var(--accent); }
    .empty { color: var(--muted); grid-column: 1 / -1; text-align: center; }
  </style>
</head>
